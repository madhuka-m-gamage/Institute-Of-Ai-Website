name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # No lockfile is committed yet (see tracker Q13), so `npm ci` isn't possible.
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npx vite build

  rules:
    name: Firestore rules tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm install -g firebase-tools
      - run: npm run test:rules
